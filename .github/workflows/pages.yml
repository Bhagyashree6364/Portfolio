name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/assets
          cp index.html style.css script.js portrait.jpg mark.jpg .nojekyll _site/
          cp assets/Bhagyashree_Software_Developer_Resume.pdf _site/assets/
          test -f _site/index.html
          test -f _site/style.css
          test -f _site/script.js
          test -f _site/portrait.jpg
          test -f _site/mark.jpg
          test -f _site/assets/Bhagyashree_Software_Developer_Resume.pdf

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
